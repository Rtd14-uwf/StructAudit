[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structaudit"
version = "0.1.0"
dependencies = [
    "pydantic>=2",
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "mdit-py-plugins",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]
